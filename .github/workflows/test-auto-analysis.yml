name: Test Auto-Analysis (Intentional Failure)

# This workflow intentionally simulates various types of build failures
# to test the auto-analysis system. It does NOT indicate a real problem.
# All simulations use temporary files to avoid polluting the repository.

on:
  workflow_dispatch:
    inputs:
      failure_type:
        description: 'Type of failure to simulate'
        required: true
        default: 'compilation_error'
        type: choice
        options:
        - compilation_error
        - test_failure
        - dependency_issue
        - transient_network
        - linting_error

jobs:
  simulate-failure:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Simulate compilation error
      if: github.event.inputs.failure_type == 'compilation_error'
      run: |
        echo "Simulating TypeScript compilation error..."
        # Create a temporary file with invalid TypeScript syntax
        cat > api/src/temp-invalid.ts << 'EOF'
        export const invalidSyntax = function( { return 'broken'; }
        // This file intentionally contains syntax errors for testing
        export const anotherError = class {
          constructor( {
            // Missing closing parenthesis and brackets
        EOF
        # Try to compile the invalid file to trigger TypeScript errors
        npx tsc api/src/temp-invalid.ts --noEmit || echo "TypeScript compilation failed as expected"
        # Remove the temporary file to keep repository clean
        rm -f api/src/temp-invalid.ts
        # Exit with error to simulate build failure
        exit 1
    
    - name: Simulate test failure
      if: github.event.inputs.failure_type == 'test_failure'
      run: |
        echo "Simulating test failure..."
        # Create a failing test in a temporary file
        cat > api/src/temp-failure.test.ts << 'EOF'
        import { describe, it, expect } from 'vitest';
        
        describe('Intentional Test Failure', () => {
          it('should fail to test auto-analysis', () => {
            expect(true).toBe(false);
          });
        });
        EOF
        # Run vitest on the specific test file to trigger failure
        npx vitest run api/src/temp-failure.test.ts || echo "Test failed as expected"
        # Clean up the temporary test file
        rm -f api/src/temp-failure.test.ts
        # Exit with error to simulate test failure
        exit 1
    
    - name: Simulate dependency issue
      if: github.event.inputs.failure_type == 'dependency_issue'
      run: |
        echo "Simulating dependency resolution error..."
        echo '{"dependencies": {"non-existent-package": "999.999.999"}}' > temp-package.json
        npm install non-existent-package@999.999.999
    
    - name: Simulate transient network error
      if: github.event.inputs.failure_type == 'transient_network'
      run: |
        echo "Simulating transient network error..."
        # Create a random failure that looks like a network issue
        # This will fail ~80% of the time to simulate transient issues
        RANDOM_NUM=$((RANDOM % 10))
        echo "Random number: $RANDOM_NUM"
        
        if [ $RANDOM_NUM -lt 8 ]; then
          echo "❌ Simulating network timeout/connection refused..."
          echo "curl: (7) Failed to connect to registry.npmjs.org port 443: Connection refused"
          echo "npm ERR! network request to https://registry.npmjs.org/some-package failed, reason: connect ECONNREFUSED"
          echo "npm ERR! network This is a temporary failure, please try again later."
          exit 1
        else
          echo "✅ Network request succeeded (simulating successful retry)"
          echo "Successfully connected to external service"
        fi
    
    - name: Simulate linting error
      if: github.event.inputs.failure_type == 'linting_error'
      run: |
        echo "Simulating ESLint errors..."
        # Create a temporary file with linting violations
        cat > frontend/src/temp-lint-errors.tsx << 'EOF'
        // This file intentionally contains linting errors for testing
        var unused_variable = 'this will cause linting errors';;;
        const another_unused = "test"
        let   badly_spaced =    "variable"  ;;
        
        export function BadComponent() {
          var x = 1
          console.log("Should not use console.log")
          return <div>Bad linting example</div>
        }
        EOF
        # Run ESLint on the temporary file to trigger linting errors
        cd frontend && npx eslint src/temp-lint-errors.tsx || echo "Linting errors detected as expected"
        # Clean up the temporary file
        rm -f src/temp-lint-errors.tsx
        cd ..
        # Exit with error to simulate linting failure
        exit 1
    
    - name: Cleanup temporary files
      if: always()
      run: |
        echo "Cleaning up any remaining temporary files..."
        rm -f api/src/temp-*.ts
        rm -f api/src/temp-*.test.ts
        rm -f frontend/src/temp-*.tsx
        rm -f temp-package.json
        echo "Cleanup completed"
    
    - name: Verify repository is clean
      if: always()
      run: |
        echo "Verifying repository state is clean..."
        git status --porcelain
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ Warning: Repository has uncommitted changes after cleanup"
          git status
        else
          echo "✅ Repository is clean - no files were polluted by failure simulation"
        fi
    
    - name: Summary of intentional failure
      if: always()
      run: |
        echo "🎯 INTENTIONAL FAILURE SIMULATION COMPLETE"
        echo "================================================"
        echo "This workflow is designed to fail on purpose to test"
        echo "the auto-analysis system. The failure is NOT a real bug!"
        echo ""
        echo "✅ Repository state: Clean (no files modified)"
        echo "✅ Simulation type: ${{ github.event.inputs.failure_type }}"
        echo "✅ Auto-analysis should create an issue for this failure"
